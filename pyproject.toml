[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-intelligence-platform"
version = "0.1.0"
description = "Stock Intelligence Platform — forecasting + agentic research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=14.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "redis>=5.0",
  "joblib>=1.3",
  "mlflow>=2.14",
  "feast>=0.40",
  "prometheus-client>=0.20",
  "prometheus-fastapi-instrumentator>=7.0",
  "structlog>=24.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
agents = [
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "qdrant-client>=1.11",
]
ui = [
  "streamlit>=1.37",
  "plotly>=5.22",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
sip-api = "backend.main:run"
sip-data = "src.pipelines.data_pipeline:main"
sip-train = "src.pipelines.training_pipeline:main"
sip-predict = "src.pipelines.inference_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "src*", "logger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
